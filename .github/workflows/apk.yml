name: APK derle

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Web dosyalarını hazırla
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192-1.png icon-512.png www/

      - name: Capacitor ile Android projesi oluştur
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: risktaki-bina-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
